<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    display: flex;
    background-color: #121212;
    color: white;
    margin: 0;
    padding: 0;
}

/* Sidebar Styles */
.sidebar {
    width: 200px;
    height: 100vh;
    background: #333;
    color: white;
    padding: 20px;
    position: fixed;
}

.sidebar a {
    display: block;
    color: white;
    padding: 10px;
    text-decoration: none;
}

.sidebar a:hover {
    background: #555;
}

/* Main Content */
.content {
    margin-left: 220px;
    padding: 20px;
    flex-grow: 1;
}

/* File Grid */
.file-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
}

/* File Cards */
.file-card {
    width: 150px;
    height: 200px;
    background-color: #1e1e1e;
    border-radius: 10px;
    overflow: hidden;
    text-align: center;
    cursor: pointer;
    transition: transform 0.2s ease-in-out;
}

.file-card:hover {
    transform: scale(1.1);
}

.file-card img {
    width: 100%;
    height: 80%;
    object-fit: cover;
    border-bottom: 1px solid #333;
}

.file-card p {
    margin: 5px 0;
    font-size: 14px;
}

    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>Your Space</h2>
        <a href="{{ url_for('dashboard',view='public') }}">Public files</a>
        <a href="{{ url_for('dashboard',view='private') }}">Private</a>
        <a href="{{ url_for('upload_page') }}">Upload</a>
        <a href="{{ url_for('logout') }}">Logout</a>
    </div>

    <!-- Main Content -->
    <div class="content">
        <h1><center>Public Cloud Files</center></h1>
        <div class="file-grid">
            {% for file in files %}
                <div class="file-card">
                    <a href="{{ url_for('get_file', filename=file) }}" >
                        <img src="{{ get_icon(file) }}" alt="File Icon">
                    </a>
                    <p>{{ file }}</p>
                </div>
            {% endfor %}
        </div>
    </div>
    
    

    <script>
        function openFile(filename, view) {
            if (view === 'public') {
                window.location.href = "/public_cloud/" + filename;
            } else if (view === 'private') {
                window.location.href = "/private_cloud/" + filename;
            }
        }
    </script>    

</body>
</html>
