<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload File</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #f4f4f4;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 350px;
        }
        h2 {
            margin-bottom: 15px;
            color: #333;
        }
        input[type="file"] {
            margin-bottom: 15px;
            padding: 10px;
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .buttons {
            display: flex;
            justify-content: space-between;
        }
        .btn {
            border: none;
            padding: 10px 15px;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            width: 48%;
        }
        .public-btn {
            background: #28a745;
        }
        .private-btn {
            background: #007bff;
        }
        .btn:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Upload File</h2>
        <input type="file" id="fileInput">
        <div class="buttons">
            <button class="btn public-btn" onclick="uploadFile('public')">Upload Public</button>
            <button class="btn private-btn" onclick="uploadFile('private')">Upload Private</button>
        </div>
    </div>

    <script>
        function uploadFile(type) {
            let fileInput = document.getElementById("fileInput");
            if (fileInput.files.length === 0) {
                alert("Please select a file!");
                return;
            }

            let formData = new FormData();
            formData.append("file", fileInput.files[0]);

            if (type === "public") {
                fetch("/upload_public", {
                    method: "POST",
                    body: formData
                }).then(response => response.json())
                .then(data => alert(data.message))
                .catch(error => console.error("Error:", error));
            } else {
                fetch("/upload_private", {
                    method: "POST",
                    body: formData
                }).then(response => response.json())
                .then(data => alert(data.message))
                .catch(error => console.error("Error:", error));
            }
        }
    </script>

</body>
</html>
