<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload File</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
            margin: 0;
            padding: 0;
            background: #121212;
            color: #f4f4f4;
        }
        .sidebar {
            width: 200px;
            height: 100vh;
            background: #333;
            color: white;
            padding: 20px;
            position: fixed;
            left: 0;
            top: 0;
        }

        .sidebar a {
            display: block;
            color: white;
            padding: 10px;
            text-decoration: none;
        }

        .sidebar a:hover {
            background: #555;
        }

        .mainContainer {
            margin-left: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: calc(100% - 220px);
            height: 100vh;
        }

        .container {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(255, 255, 255, 0.2);
            text-align: center;
            width: 400px;
        }
        h1 {
            margin-bottom: 15px;
        }
        input[type="file"], input[type="text"] {
            margin-bottom: 15px;
            padding: 10px;
            width: 100%;
            border: 1px solid #444;
            border-radius: 5px;
            background: #252525;
            color: #f4f4f4;
            box-sizing: border-box; /* Ensures padding doesn't affect width */
        }

        .buttons {
            display: flex;
            justify-content: space-between;
        }
        .btn {
            border: none;
            padding: 10px 15px;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            width: 48%;
        }
        .public-btn {
            background: #28a745;
        }
        .private-btn {
            background: #007bff;
        }
        .btn:hover {
            opacity: 0.8;
        }
        .preview {
            margin-top: 15px;
            max-width: 100%;
        }
        .file-label {
            display: block;
            margin-bottom: 5px;
            color: #aaa;
            font-size: 14px;
        }

    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Your Space</h2>
        <a href="{{ url_for('dashboard',view='public') }}">Public files</a>
        <a href="{{ url_for('dashboard',view='private') }}">Private</a>
        <a href="{{ url_for('upload_page') }}">Upload</a>
        <a href="{{ url_for('logout') }}">Logout</a>
    </div>
    <div class="mainContainer">
        <div class="container">
            <h1>Upload File</h1>
            <label for="fileInput" class="file-label">Upload file</label>
            <input type="file" id="fileInput" onchange="previewFile()"><hr><br>
            <input type="text" id="titleInput" placeholder="Enter title (Optional)">
            <label for="thumbnailInput" class="file-label">Upload thumbnail (Optional)</label>
            <input type="file" id="thumbnailInput" accept="image/*">
                        <div id="filePreview" class="preview"></div>
            <div class="buttons">
                <button class="btn public-btn" onclick="uploadFile('public')">Upload Public</button>
                <button class="btn private-btn" onclick="uploadFile('private')">Upload Private</button>
            </div>
        </div>
    </div>

    <script>
        function previewFile() {
            let fileInput = document.getElementById("fileInput");
            let preview = document.getElementById("filePreview");
            preview.innerHTML = "";
            
            if (fileInput.files.length > 0) {
                let file = fileInput.files[0];
                let fileType = file.type;
                let reader = new FileReader();
                
                reader.onload = function(e) {
                    if (fileType.startsWith("image")) {
                        preview.innerHTML = `<img src="${e.target.result}" width="100%">`;
                    } else if (fileType.startsWith("video")) {
                        preview.innerHTML = `<video controls width="100%"><source src="${e.target.result}"></video>`;
                    } else if (fileType.startsWith("audio")) {
                        preview.innerHTML = `<audio controls><source src="${e.target.result}"></audio>`;
                    } else if (fileType.includes("pdf")) {
                        preview.innerHTML = `<embed src="${e.target.result}" width="100%" height="300px">`;
                    } else {
                        preview.innerHTML = `<p>File selected: ${file.name}</p>`;
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        function uploadFile(type) {
            let fileInput = document.getElementById("fileInput");
            let titleInput = document.getElementById("titleInput").value;
            let thumbnailInput = document.getElementById("thumbnailInput");
            
            if (fileInput.files.length === 0) {
                alert("Please select a file!");
                return;
            }

            let formData = new FormData();
            formData.append("file", fileInput.files[0]);
            if (type === "public") {
                formData.append("title", titleInput);
                if (thumbnailInput.files.length > 0) {
                    formData.append("thumbnail", thumbnailInput.files[0]);
                }
            }

            let url = type === "public" ? "/upload_public" : "/upload_private";
            
            fetch(url, {
                method: "POST",
                body: formData
            })
            .then(response => response.json())
            .then(data => alert(data.message))
            .catch(error => console.error("Error:", error));
        }
    </script>
</body>
</html>
